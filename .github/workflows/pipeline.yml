name: Tourism Project
on:
  push:
    branches: [main]
    paths-ignore:
      - "tourism_project/deployment/*.joblib"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/data_register.py
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/prep.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Train and save model
        run: python tourism_project/model_building/train.py
      - name: Verify saved model
        run: |
          test -s tourism_project/deployment/tourism_package_prediction.joblib
          ls -lh tourism_project/deployment/tourism_package_prediction.joblib
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tourism_project/deployment/tourism_package_prediction.joblib
          if ! git diff --cached --quiet; then
            git commit -m "Update trained tourism model [skip ci]"
            git push
          fi
